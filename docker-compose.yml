services:
  app:
    build:
      context: .
    image: doubao-tts-web:local
    init: true
    restart: unless-stopped
    ports:
      - "${DOCKER_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      VOLCENGINE_API_KEY: "${VOLCENGINE_API_KEY:?set VOLCENGINE_API_KEY in .env}"
      APP_USERNAME: "${APP_USERNAME:-admin}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
